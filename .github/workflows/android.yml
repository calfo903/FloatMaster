name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Grant execute
        run: chmod +x gradlew || echo "no wrapper"
      - name: Lint
        run: ./gradlew lintDebug || ./gradlew :app:lintDebug || echo "lint skip"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Assemble Debug
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatMaster-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
